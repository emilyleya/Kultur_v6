<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS – Globales Welterbe</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar-left">
            <header class="app-header">
                <div class="brand">
                    <span class="brand-logo">⏳</span>
                    <h1 class="brand-title">CHRONOS</h1>
                </div>
                <div class="xp-display">
                    <div class="xp-text"><span id="rank-badge">Archivar</span> · <span id="xp-points">0</span> XP</div>
                    <div class="xp-bar-container"><div id="xp-fill" class="xp-bar-fill"></div></div>
                </div>
            </header>

            <nav class="nav-tabs-wrapper">
                <button class="nav-tab active" data-view="explore">Erkunden</button>
                <button class="nav-tab" data-view="favorites">Favoriten (<span id="fav-count">0</span>)</button>
            </nav>

            <div id="view-explore" class="view-panel active">
                <div class="search-sort-bar">
                    <span class="results-indicator">Welterbestätten der UNESCO</span>
                </div>
                <div id="quick-list-container" class="quick-list">
                    </div>
            </div>

            <div id="view-favorites" class="view-panel" style="display: none;">
                <div id="fav-list-container" class="quick-list">
                    <div class="empty-fav">Noch keine Favoriten hinzugefügt.</div>
                </div>
            </div>
        </aside>

        <main class="map-viewport">
            <div id="map"></div>
            
            <div class="map-controls">
                <button id="btn-toggle-theme" class="ctrl-btn" title="Farbschema wechseln">🌗</button>
                <button id="btn-zoom-in" class="ctrl-btn">＋</button>
                <button id="btn-zoom-out" class="ctrl-btn">－</button>
            </div>
        </main>

        <aside id="panel-welcome" class="sidebar-right active">
            <div class="welcome-centered">
                <div class="welcome-icon">🌍</div>
                <h2>Willkommen bei CHRONOS</h2>
                <p>Klicke auf einen Marker auf der Karte oder wähle einen Eintrag aus der Liste, um tiefer in die Geschichte einzutauchen.</p>
            </div>
        </aside>

        <aside id="panel-details" class="sidebar-right">
            <button id="btn-close-details" class="btn-close">✕</button>
            <div class="details-scroll-area">
                <header class="details-header">
                    <div id="site-country" class="meta-country">Land</div>
                    <div id="site-category" class="meta-category">Kategorie</div>
                    <h2 id="site-title">Titel der Stätte</h2>
                    <div id="site-meta" class="meta-year">Eingeschrieben seit: –</div>
                </header>

                <div class="gallery-wrapper">
                    <img id="gallery-img-active" class="gallery-main" src="" alt="Welterbe">
                </div>

                <div class="action-bar">
                    <button id="btn-favorite" class="action-btn">☆</button>
                </div>

                <div class="details-tabs">
                    <button class="tab-trigger active" data-tab="tab-context">Beschreibung</button>
                    <button class="tab-trigger" data-tab="tab-details">Geodaten</button>
                </div>

                <div id="tab-context" class="tab-panel active">
                    <div id="site-context-dynamic"></div>
                </div>

                <div id="tab-details" class="tab-panel">
                    <div id="site-details-dynamic"></div>
                </div>
            </div>
        </aside>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="app.js"></script>
</body>
</html>
