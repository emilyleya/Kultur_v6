<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS – Globales Welterbe</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>

    <div id="map"></div>

    <header class="header">
        <div>
            <div class="header-logo">CHRONOS</div>
            <div class="header-sub">Globales Welterbe</div>
        </div>
        <div class="header-xp">
            <div class="xp-label"><span id="xp-rank">Archivar</span> · <span id="xp-points">0</span> XP</div>
            <div class="xp-bar"><div id="xp-fill" class="xp-fill" style="width:0%"></div></div>
        </div>
    </header>

    <aside class="sidebar">

        <div id="panel-welcome" class="panel active">
            <div class="welcome-tag">UNESCO world heritage site</div>
            <h2 class="welcome-title">The sights of the world</h2>
            <p class="welcome-lead">click a dot to discover the world</p>

            <div class="nav-tabs">
                <button class="nav-tab active" data-view="explore">Explore</button>
                <button class="nav-tab" data-view="favorites">
                    Saved (<span id="fav-count">0</span>)
                </button>
            </div>
            
            <div class="filter-container">
                <div class="filter-group">
                    <div class="filter-label">Filter</div>
                    <div class="filter-chips vertical">
                        <button class="filter-btn active" data-filter-type="all" data-filter-val="all">All</button>
                        <button class="filter-btn" data-filter-type="type" data-filter-val="wonder">★ the Seven Wonders of the World</button>
                        <button class="filter-btn" data-filter-type="type" data-filter-val="heritage">🏛️ World Heritage Sites</button>
                    </div>
                </div>

              <div class="filter-divider">Epochen</div>

                <div class="filter-group">
                    <div class="filter-chips row">
                        <button class="filter-btn btn-ancient" data-filter-type="era" data-filter-val="ancient">Ancient World</button>
                        <button class="filter-btn btn-medieval" data-filter-type="era" data-filter-val="medieval">Middle Ages</button>
                        <button class="filter-btn btn-modern" data-filter-type="era" data-filter-val="modern">Modern Age</button>
                    </div>
                </div>

                <div class="filter-divider">Kontinente</div>

                <div class="filter-group">
                    <div class="filter-chips row">
                        <button class="filter-btn" data-filter-type="region" data-filter-val="Europe and North America">Europe</button>
                        <button class="filter-btn" data-filter-type="region" data-filter-val="Asia and the Pacific">Asia/Pacific</button>
                        <button class="filter-btn" data-filter-type="region" data-filter-val="Africa">Africa</button>
                        <button class="filter-btn" data-filter-type="region" data-filter-val="Latin America and the Caribbean">Latin America/Caribbean</button>
                        <button class="filter-btn" data-filter-type="region" data-filter-val="Arab States">Arab States</button>
                    </div>
                </div>
            </div>

            <div id="view-explore" class="site-list"></div>
            
            <div id="view-favorites" style="display:none">
                <div class="site-list" id="fav-list">
                    <div class="empty-state">Noch keine Favoriten hinzugefügt.</div>
                </div>
            </div>
        </div>

      <div id="panel-details" class="panel">
    <button class="back-btn" id="btn-back">← Zurück zur Übersicht</button>

    <div class="detail-scroll-body">
    <div class="detail-badges">

            <div class="detail-header">
                <h2 class="detail-title" id="detail-title">–</h2>
                <button class="fav-btn" id="btn-fav">☆</button>
            </div>
            <div class="detail-meta" id="detail-meta">–</div>
            
            <div class="slideshow" id="slideshow"></div>
            
            <div class="tabs-nav">
                <button class="tab-btn active" data-tab="tab-desc">Beschreibung</button>
                <button class="tab-btn" data-tab="tab-geo">Geodaten</button>
            </div>

            <div id="tab-desc" class="tab-panel active">
                <div id="detail-description" class="content-text">–</div>
            </div>
            <div id="tab-geo" class="tab-panel">
                <div id="detail-geodata" class="content-text">–</div>
            </div>

            <!-- Virtual Tour Button -->
            <div class="tour-btn-wrapper">
                <button class="tour-start-btn" id="btn-start-tour">
                    <span class="tour-btn-icon">▶</span>
                    <span class="tour-btn-text">
                        <span class="tour-btn-label">Start Virtual Tour</span>
                        <span class="tour-btn-sub">3D Karte · Historische Anekdoten</span>
                    </span>
                    <span class="tour-btn-arrow">→</span>
                </button>
            </div>
        </div>
</div> <!-- end detail-scroll-body -->
    </div> <!-- end panel-details -->
    </aside> <button class="toggle-sidebar-btn" id="btn-toggle-sidebar" title="Seitenleiste ein-/ausklappen">
        <span>◂</span>
    </button>
    <!-- ═══════════════════════════════════════════
         VIRTUAL TOUR OVERLAY
    ═══════════════════════════════════════════ -->
    <div id="tour-overlay" class="tour-overlay hidden">

        <!-- Header Bar -->
        <div class="tour-overlay-header">
            <div class="tour-overlay-title">
                <span class="tour-title-eyebrow">Virtual Tour</span>
                <span class="tour-title-name" id="tour-site-name">–</span>
            </div>
            <div class="tour-header-controls">
                <div class="tour-progress-track">
                    <span class="tour-progress-label" id="tour-progress-label">Station 1 / 3</span>
                    <div class="tour-progress-bar">
                        <div class="tour-progress-fill" id="tour-progress-fill" style="width: 33%"></div>
                    </div>
                </div>
                <button class="tour-close-btn" id="btn-close-tour">✕</button>
            </div>
        </div>

        <!-- Split Body -->
        <div class="tour-body">

            <!-- LEFT: Scrollable Story -->
            <div class="tour-story-pane" id="tour-story-pane">
                <div class="tour-stations" id="tour-stations">
                    <!-- Stations injected by JS -->
                </div>
            </div>

            <!-- RIGHT: MapLibre 3D Map -->
            <div class="tour-map-pane">
                <div id="tour-map-3d"></div>
                <div class="tour-map-badge" id="tour-map-badge">
                    <span class="tour-map-badge-dot"></span>
                    <span id="tour-map-badge-text">Fliege zur Station…</span>
                </div>
            </div>

        </div>
    </div>

    <div class="map-controls">
        <button class="ctrl-btn" id="btn-theme" title="Theme wechseln">🌗</button>
        <button class="ctrl-btn" id="btn-zoom-in" title="Heranzoomen">+</button>
        <button class="ctrl-btn" id="btn-zoom-out" title="Herauszoomen">−</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

</body>
</html>
